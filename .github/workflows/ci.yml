name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging check
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Format, lint, and syntax guard
        run: python -m pip install ruff && ruff format --check . && ruff check . && python -m compileall -q src tests && git diff --check
      - name: Unit, simulation, determinism, and save/load tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Schema and data validation
        run: PYTHONPATH=src python -c "from worldsmith.simulation import SAVE_VERSION, create_demo_world; assert create_demo_world().to_dict()['version'] == SAVE_VERSION"
